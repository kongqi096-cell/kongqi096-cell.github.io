<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿搭指南 | 找到适合你的穿搭博主</title>
<style>
  :root {
    --bg: #faf9f7;
    --ink: #1d1d1f;
    --muted: #6b6b6f;
    --accent: #e85d3d;
    --line: #e8e6e1;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }

  /* 顶部导航 + 步骤条 */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250,249,247,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 900px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; cursor: pointer; }
  .logo span { color: var(--accent); }
  .steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .step { display: flex; align-items: center; gap: 6px; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--line); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700;
  }
  .step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.done .step-num { background: var(--ink); border-color: var(--ink); color: #fff; }
  .step-label { display: none; }
  @media (min-width: 640px) { .step-label { display: inline; } }

  main { max-width: 900px; margin: 0 auto; padding: 50px 24px 80px; }
  .page { display: none; }
  .page.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

  /* 表单 */
  .form-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 36px 32px;
  }
  .form-card h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
  .form-card > p { color: var(--muted); margin-bottom: 30px; font-size: 15px; }
  .field { margin-bottom: 26px; }
  .field > label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 10px; }

  /* 性别/体型/风格 选择 */
  .choice-group { display: flex; gap: 12px; flex-wrap: wrap; }
  #styleGroup .choice { flex: 0 0 calc((100% - 48px) / 5); }
  .choice {
    flex: 1; min-width: 120px; text-align: center;
    padding: 16px 12px; border: 1.5px solid var(--line);
    border-radius: 14px; cursor: pointer; font-size: 15px;
    background: var(--card); transition: all .15s;
  }
  .choice:hover { border-color: var(--muted); }
  .choice.selected { border-color: var(--accent); background: #fdeee8; font-weight: 700; }
  .choice .ch-desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .choice.selected .ch-desc { color: #a3472e; }

  /* 数字输入 */
  .num-row { display: flex; gap: 16px; }
  .num-field { flex: 1; }
  .num-field input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 14px; outline: none;
    transition: border-color .15s;
  }
  .num-field input:focus { border-color: var(--accent); }
  .num-field small { color: var(--muted); font-size: 12px; }

  .btn {
    padding: 14px 32px; border-radius: 999px; font-size: 15px;
    font-weight: 700; cursor: pointer; border: none;
    transition: opacity .2s, transform .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-row { display: flex; gap: 12px; margin-top: 8px; }

  /* 推荐页 */
  .result-head { text-align: center; margin-bottom: 36px; }
  .result-head h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .result-head p { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .result-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .result-tag {
    font-size: 13px; padding: 5px 14px; border-radius: 999px;
    background: var(--ink); color: #fff; font-weight: 600;
  }

  .creators { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .creator {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px; text-align: center;
    transition: transform .2s, box-shadow .2s;
  }
  .creator:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
  .creator-avatar {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff; font-weight: 800;
  }
  .creator h3 { font-size: 17px; font-weight: 700; }
  .creator .creator-desc { font-size: 13px; color: var(--muted); margin: 6px 0 14px; min-height: 40px; }
  .creator-meta { font-size: 12px; color: var(--muted); margin-bottom: 16px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .creator-meta span {
    background: var(--bg); padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  .creator-link {
    display: block; padding: 10px 0; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
    transition: opacity .2s;
  }
  .creator-link:hover { opacity: 0.85; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  /* 分享页 */
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .share-form { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
  .share-form h2 { font-size: 20px; font-weight: 800; margin-bottom: 18px; }
  .share-form input, .share-form select, .share-form textarea {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1.5px solid var(--line); border-radius: 12px; outline: none;
    margin-bottom: 14px; font-family: inherit;
  }
  .share-form input:focus, .share-form textarea:focus, .share-form select:focus { border-color: var(--accent); }
  .share-form textarea { resize: vertical; min-height: 80px; }
  .share-list h2 { font-size: 20px; font-weight: 800; margin-bottom: 18px; }
  .share-item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .share-item .si-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .share-item .si-name { font-weight: 700; font-size: 15px; }
  .share-item .si-tag { font-size: 12px; color: var(--accent); font-weight: 600; }
  .share-item p { font-size: 14px; color: var(--muted); }

  .empty-list { color: var(--muted); text-align: center; padding: 40px 0; }

  @media (max-width: 760px) {
    .creators { grid-template-columns: 1fr; }
    .share-grid { grid-template-columns: 1fr; }
    .num-row { flex-direction: column; }
    #styleGroup .choice { flex: 0 0 calc((100% - 12px) / 2); }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo" onclick="goPage(0)">穿搭<span>指南</span></div>
    <div class="steps">
      <div class="step active" id="step1"><span class="step-num">1</span><span class="step-label">填写信息</span></div>
      <span style="color:var(--line)">—</span>
      <div class="step" id="step2"><span class="step-num">2</span><span class="step-label">博主推荐</span></div>
      <span style="color:var(--line)">—</span>
      <div class="step" id="step3"><span class="step-num">3</span><span class="step-label">分享穿搭</span></div>
    </div>
  </div>
</header>

<main>
  <!-- 第 1 页：信息填写 -->
  <section class="page active" id="page0">
    <div class="form-card">
      <h1>先了解你，再给你推荐</h1>
      <p>花 30 秒填一下，我们按你的情况匹配适合的穿搭博主。</p>

      <div class="field">
        <label>你的性别</label>
        <div class="choice-group" id="genderGroup">
          <div class="choice" data-val="male">👦 男生</div>
          <div class="choice" data-val="female">👧 女生</div>
        </div>
      </div>

      <div class="field">
        <label>身高 & 体重</label>
        <div class="num-row">
          <div class="num-field">
            <input type="number" id="height" placeholder="身高 (cm)" min="120" max="230">
            <small>例：170</small>
          </div>
          <div class="num-field">
            <input type="number" id="weight" placeholder="体重 (kg)" min="30" max="200">
            <small>例：60</small>
          </div>
        </div>
      </div>

      <div class="field">
        <label>喜欢的风格（可多选）</label>
        <div class="choice-group" id="styleGroup">
          <div class="choice" data-val="casual">休闲<small class="ch-desc">日常舒适</small></div>
          <div class="choice" data-val="commute">通勤<small class="ch-desc">上班上学</small></div>
          <div class="choice" data-val="trend">潮流<small class="ch-desc">街头个性</small></div>
          <div class="choice" data-val="sport">运动<small class="ch-desc">活力户外</small></div>
          <div class="choice" data-val="campus">学院风<small class="ch-desc">青春校园</small></div>
          <div class="choice" data-val="minimal">简约风<small class="ch-desc">干净利落</small></div>
          <div class="choice" data-val="vintage">复古风<small class="ch-desc">怀旧质感</small></div>
          <div class="choice" data-val="formal">职场风<small class="ch-desc">专业正式</small></div>
          <div class="choice" data-val="date">约会风<small class="ch-desc">精致有型</small></div>
          <div class="choice" data-val="home">居家风<small class="ch-desc">舒适放松</small></div>
          <div class="choice" data-val="street">街头<small class="ch-desc">嘻哈潮流</small></div>
          <div class="choice" data-val="party">聚会<small class="ch-desc">热闹出彩</small></div>
          <div class="choice" data-val="travel">旅行度假<small class="ch-desc">轻松出行</small></div>
          <div class="choice" data-val="gala">正式宴会<small class="ch-desc">隆重场合</small></div>
          <div class="choice" data-val="interview">面试<small class="ch-desc">得体加分</small></div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextPage()">查看推荐 →</button>
      </div>
    </div>
  </section>

  <!-- 第 2 页：博主推荐 -->
  <section class="page" id="page1">
    <div class="result-head">
      <h1>为你找到这些博主</h1>
      <p id="resultSummary">根据你的信息，推荐以下参考风格</p>
      <div class="result-tags" id="resultTags"></div>
    </div>
    <div class="creators" id="creatorList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:40px;">
      <button class="btn btn-ghost" onclick="goPage(0)">← 重新填写</button>
      <button class="btn btn-primary" onclick="goPage(2)">分享我的穿搭 →</button>
    </div>
  </section>

  <!-- 第 3 页：分享 -->
  <section class="page" id="page2">
    <div class="share-grid">
      <div class="share-form">
        <h2>分享你的穿搭</h2>
        <input type="text" id="shareName" placeholder="你的昵称">
        <select id="shareStyle">
          <option value="">选择风格</option>
          <option value="休闲">休闲</option>
          <option value="通勤">通勤</option>
          <option value="潮流">潮流</option>
          <option value="运动">运动</option>
        </select>
        <textarea id="shareText" placeholder="介绍你的搭配，比如：宽松白T + 直筒牛仔裤 + 帆布鞋"></textarea>
        <button class="btn btn-primary" style="width:100%;" onclick="submitShare()">发布分享</button>
      </div>
      <div class="share-list">
        <h2>大家的穿搭</h2>
        <div id="shareList"></div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center; margin-top:40px;">
      <button class="btn btn-ghost" onclick="goPage(1)">← 返回推荐</button>
    </div>
  </section>
</main>

<script>
  // 占位博主数据 —— 拿到真实抖音博主后替换这里
  const CREATORS = [
    { name: "穿搭博主A", gender: "male", height: 172, styles: ["casual","trend","street","date","party"], desc: "小个子男生穿搭，显高技巧一学就会", avatar: "#1d1d1f", link: "https://www.douyin.com/", tags: ["显高","男生"] },
    { name: "穿搭博主B", gender: "male", height: 178, styles: ["commute","casual","formal","interview","travel"], desc: "微胖男生成熟通勤风，遮肉又体面", avatar: "#7c6b4f", link: "https://www.douyin.com/", tags: ["微胖","通勤"] },
    { name: "穿搭博主C", gender: "male", height: 185, styles: ["trend","sport","street","party","travel"], desc: "高个子潮流运动风，街头感十足", avatar: "#4f6b7c", link: "https://www.douyin.com/", tags: ["高个","潮流"] },
    { name: "穿搭博主D", gender: "female", height: 155, styles: ["casual","trend","street","date","party"], desc: "小个子女生甜酷穿搭，显高显瘦", avatar: "#c06b7c", link: "https://www.douyin.com/", tags: ["小个子","女生"] },
    { name: "穿搭博主E", gender: "female", height: 165, styles: ["commute","casual","formal","interview","travel"], desc: "微胖女生气质通勤，遮肉不显壮", avatar: "#7c6bc0", link: "https://www.douyin.com/", tags: ["微胖","通勤"] },
    { name: "穿搭博主F", gender: "female", height: 172, styles: ["trend","sport","street","party","travel","gala"], desc: "高个子女生活力风，比例气场全开", avatar: "#5ba86b", link: "https://www.douyin.com/", tags: ["高个","运动"] },
    { name: "八号机", gender: "unisex", height: 160, styles: ["street"], desc: "男女通用街头穿搭，中性风酷感十足", avatar: "#c05a4f", douyinId: "buzzlightyear8zz", link: "https://www.douyin.com/search/buzzlightyear8zz?type=user", tags: ["通用","街头"] },
    { name: "707", gender: "female", height: 160, styles: ["street"], desc: "街头风女生穿搭，酷感又日常", avatar: "#6b5ba8", douyinId: "DqNanA_707", link: "https://www.douyin.com/search/DqNanA_707?type=user", tags: ["街头","女生"] },
    { name: "郑不凡", gender: "male", height: 160, styles: ["casual"], desc: "小个子男生休闲穿搭，舒适又有型", avatar: "#3f7c6b", douyinId: "Zf19970721", link: "https://www.douyin.com/search/Zf19970721?type=user", tags: ["休闲","男生"] },
  ];

  const STYLE_NAMES = { casual: "休闲", commute: "通勤", trend: "潮流", sport: "运动", campus: "学院风", minimal: "简约风", vintage: "复古风", formal: "职场风", date: "约会风", home: "居家风", street: "街头", party: "聚会", travel: "旅行度假", gala: "正式宴会", interview: "面试" };
  const GENDER_NAMES = { male: "男生", female: "女生" };

  let userInfo = { gender: "", height: 0, weight: 0, styles: [] };
  let shares = JSON.parse(localStorage.getItem("shares") || "[]");

  function initChoices() {
    document.querySelectorAll(".choice-group").forEach(group => {
      group.addEventListener("click", e => {
        const c = e.target.closest(".choice");
        if (!c) return;
        const multi = c.closest("#styleGroup");
        if (multi) {
          c.classList.toggle("selected");
        } else {
          c.parentElement.querySelectorAll(".choice").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
        }
      });
    });
  }

  function nextPage() {
    const gender = document.querySelector("#genderGroup .choice.selected");
    const height = parseFloat(document.getElementById("height").value);
    const weight = parseFloat(document.getElementById("weight").value);
    const styles = [...document.querySelectorAll("#styleGroup .choice.selected")].map(c => c.dataset.val);

    if (!gender) { alert("请选择性别"); return; }
    if (!height || !weight) { alert("请填写身高和体重"); return; }
    if (styles.length === 0) { alert("请至少选择一个风格"); return; }

    userInfo = { gender: gender.dataset.val, height, weight, styles };
    renderResult();
    goPage(1);
  }

  function renderResult() {
    const matched = CREATORS.filter(c =>
      (c.gender === userInfo.gender || c.gender === "unisex") &&
      c.styles.some(s => userInfo.styles.includes(s))
    ).sort((a, b) => heightScore(a) - heightScore(b));
    const fallback = matched.length === 0
      ? CREATORS.filter(c => c.gender === userInfo.gender || c.gender === "unisex").sort((a, b) => heightScore(a) - heightScore(b))
      : matched;

    document.getElementById("resultSummary").textContent =
      `${GENDER_NAMES[userInfo.gender]} · 身高${userInfo.height}cm · 体重${userInfo.weight}kg`;

    const tags = document.getElementById("resultTags");
    tags.innerHTML = userInfo.styles.map(s => `<span class="result-tag">${STYLE_NAMES[s]}</span>`).join("");

    const list = document.getElementById("creatorList");
    list.innerHTML = fallback.map((c, i) => `
      <div class="creator">
        <div class="creator-avatar" style="background:${c.avatar}">${c.name[0]}</div>
        <h3>${c.name}</h3>
        <p class="creator-desc">${c.desc}</p>
        <div class="creator-meta">${c.tags.map(t => `<span>${t}</span>`).join("")}<span>身高 ${c.height}cm</span></div>
        <a class="creator-link" href="${c.link}" target="_blank" rel="noopener">抖音：${c.douyinId || "去搜索"} →</a>
      </div>
    `).join("");
  }

  function heightScore(c) {
    return Math.abs(c.height - userInfo.height);
  }

  function goPage(n) {
    document.querySelectorAll(".page").forEach((p, i) => p.classList.toggle("active", i === n));
    document.querySelectorAll(".step").forEach((s, i) => {
      s.classList.toggle("active", i === n);
      s.classList.toggle("done", i < n);
    });
    window.scrollTo({ top: 0 });
  }

  function submitShare() {
    const name = document.getElementById("shareName").value.trim();
    const style = document.getElementById("shareStyle").value;
    const text = document.getElementById("shareText").value.trim();
    if (!name || !style || !text) { alert("请填写完整再发布"); return; }

    shares.unshift({ name, style, text, time: new Date().toLocaleDateString() });
    localStorage.setItem("shares", JSON.stringify(shares));
    document.getElementById("shareName").value = "";
    document.getElementById("shareStyle").value = "";
    document.getElementById("shareText").value = "";
    renderShares();
  }

  function renderShares() {
    const list = document.getElementById("shareList");
    if (shares.length === 0) {
      list.innerHTML = `<div class="empty-list">还没有分享，来发第一条吧 🎉</div>`;
      return;
    }
    list.innerHTML = shares.map(s => `
      <div class="share-item">
        <div class="si-head">
          <span class="si-name">${s.name}</span>
          <span class="si-tag">${s.style}</span>
        </div>
        <p>${s.text}</p>
        <small style="color:var(--muted)">${s.time}</small>
      </div>
    `).join("");
  }

  initChoices();
  renderShares();
</script>

</body>
</html>
