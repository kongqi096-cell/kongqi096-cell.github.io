<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿搭指南 | 找到适合你的穿搭博主</title>
<style>
  :root {
    --bg: #f7f5f2;
    --ink: #232326;
    --muted: #8a8a8f;
    --accent: #ff5a4e;
    --accent2: #ff8a5c;
    --line: #ece9e4;
    --card: #ffffff;
    --shadow: 0 10px 30px rgba(35,35,38,0.08);
    --shadow-hover: 0 16px 40px rgba(35,35,38,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }

  /* 背景装饰光晕 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 400px at 10% -10%, rgba(255,138,92,0.12), transparent 70%),
      radial-gradient(500px 350px at 110% 15%, rgba(255,90,78,0.10), transparent 70%),
      radial-gradient(700px 500px at 50% 120%, rgba(120,140,255,0.06), transparent 70%);
  }

  /* 顶部导航 + 步骤条 */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(247,245,242,0.82); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 940px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-size: 20px; font-weight: 800; letter-spacing: -0.5px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-icon {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; box-shadow: 0 4px 10px rgba(255,90,78,0.35);
  }
  .logo span { color: var(--accent); }
  .steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .step { display: flex; align-items: center; gap: 6px; transition: color .2s; }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1.5px solid var(--line); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700;
    transition: all .25s; background: var(--card);
  }
  .step.active { color: var(--ink); font-weight: 600; }
  .step.active .step-num {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff; box-shadow: 0 3px 8px rgba(255,90,78,0.35);
  }
  .step.done { color: var(--muted); }
  .step.done .step-num {
    background: var(--ink); border-color: var(--ink); color: #fff;
  }
  .step-divider { color: var(--line); }
  .step-label { display: none; }
  @media (min-width: 640px) { .step-label { display: inline; } }

  main { max-width: 940px; margin: 0 auto; padding: 46px 24px 90px; }
  .page { display: none; }
  .page.active { display: block; animation: pageIn .35s cubic-bezier(.2,.8,.3,1); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* 表单卡片 */
  .form-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 24px; padding: 40px 36px;
    box-shadow: var(--shadow);
  }
  .form-card h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--ink), #555);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .form-card > p { color: var(--muted); margin-bottom: 32px; font-size: 15px; }
  .field { margin-bottom: 28px; }
  .field > label {
    display: block; font-size: 14px; font-weight: 700; margin-bottom: 12px;
    letter-spacing: 0.2px;
  }

  /* 选择按钮 */
  .choice-group { display: flex; gap: 12px; flex-wrap: wrap; }

  /* 蜂窝样式（Apple Watch 风格） */
  #styleGroup { display: block; }
  .hex-row { display: flex; justify-content: center; gap: 14px; margin-bottom: -8px; }
  .hex-row.shift { margin-left: 52px; }
  .hex-row:last-child { margin-bottom: 0; }
  #styleGroup .choice {
    flex: none; width: 100px; height: 100px;
    text-align: center; padding: 0;
    border: 1.5px solid var(--line); border-radius: 50%;
    font-size: 14px; cursor: pointer;
    background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(35,35,38,0.08), inset 0 -2px 4px rgba(35,35,38,0.06);
    transition: all .2s ease; position: relative;
  }
  #styleGroup .choice .choice-emoji {
    display: block; font-size: 28px; line-height: 1; margin-bottom: 5px;
    filter: grayscale(20%); transition: transform .2s;
  }
  #styleGroup .choice:hover {
    border-color: var(--accent2);
    transform: translateY(-7px);
    box-shadow: 0 14px 24px rgba(255,138,92,0.35), inset 0 -3px 6px rgba(35,35,38,0.1);
  }
  #styleGroup .choice:hover .choice-emoji { transform: scale(1.12); }
  #styleGroup .choice.selected {
    border-color: transparent; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 26px rgba(255,90,78,0.4), inset 0 -4px 8px rgba(0,0,0,0.15);
  }
  #styleGroup .choice.selected .choice-emoji { transform: scale(1.1); filter: grayscale(0%); }
  #styleGroup .choice .ch-desc {
    display: block; font-size: 11px; color: var(--muted);
    font-weight: 400; margin-top: 2px; line-height: 1.2; transition: color .2s;
  }
  #styleGroup .choice.selected .ch-desc { color: rgba(255,255,255,0.9); }

  /* 通用选择按钮（性别等） */
  .choice {
    flex: 1; min-width: 120px; text-align: center;
    padding: 17px 12px; border: 1.5px solid var(--line);
    border-radius: 16px; cursor: pointer; font-size: 15px;
    background: var(--card); transition: all .18s ease;
    position: relative; overflow: hidden;
  }
  .choice .choice-emoji {
    display: block; font-size: 26px; margin-bottom: 6px;
    filter: grayscale(20%); transition: transform .2s;
  }
  .choice:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,138,92,0.15); }
  .choice:hover .choice-emoji { transform: scale(1.15); }
  .choice.selected {
    border-color: transparent; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 20px rgba(255,90,78,0.3);
  }
  .choice.selected .choice-emoji { transform: scale(1.1); filter: grayscale(0%); }
  .choice .ch-desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; transition: color .2s; }
  .choice.selected .ch-desc { color: rgba(255,255,255,0.85); }

  /* 数字输入 */
  .num-row { display: flex; gap: 16px; }
  .num-field { flex: 1; }
  .num-field input {
    width: 100%; padding: 15px 16px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 16px; outline: none;
    transition: all .2s; background: #fbfaf8;
  }
  .num-field input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(255,90,78,0.08); }
  .num-field small { color: var(--muted); font-size: 12px; }

  /* 按钮 */
  .btn {
    padding: 15px 34px; border-radius: 999px; font-size: 15px;
    font-weight: 700; cursor: pointer; border: none;
    transition: all .2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 8px 20px rgba(255,90,78,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,90,78,0.4); }
  .btn-ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: #fff; transform: translateY(-2px); }
  .btn-row { display: flex; gap: 12px; margin-top: 10px; }

  /* 推荐页 */
  .result-head { text-align: center; margin-bottom: 40px; }
  .result-head h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--ink), #555);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-head p { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .result-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .result-tag {
    font-size: 13px; padding: 6px 16px; border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-weight: 600; box-shadow: 0 4px 10px rgba(255,90,78,0.25);
  }

  .creators { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .creator {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 22px; text-align: center;
    transition: all .25s ease; position: relative;
  }
  .creator::before {
    content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 3px;
    border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0; transition: opacity .25s;
  }
  .creator:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
  .creator:hover::before { opacity: 1; }
  .creator-avatar {
    width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff; font-weight: 800;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    background: linear-gradient(135deg, #ff5a4e, #ff8a5c);
  }
  .creator h3 { font-size: 17px; font-weight: 800; }
  .creator .creator-desc { font-size: 13px; color: var(--muted); margin: 8px 0 16px; min-height: 40px; }
  .creator-meta { font-size: 12px; color: var(--muted); margin-bottom: 18px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .creator-meta span {
    background: #f5f3ef; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); font-weight: 600;
  }
  .creator-meta .height-tag { color: var(--accent); }
  .creator-link {
    display: block; padding: 12px 0; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
    transition: all .2s; letter-spacing: 0.3px;
  }
  .creator-link:hover { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  /* 分享页 */
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .share-form {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 30px; box-shadow: var(--shadow);
  }
  .share-form h2 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .share-form input, .share-form select, .share-form textarea {
    width: 100%; padding: 13px 15px; font-size: 14px;
    border: 1.5px solid var(--line); border-radius: 14px; outline: none;
    margin-bottom: 14px; font-family: inherit; background: #fbfaf8;
    transition: all .2s;
  }
  .share-form input:focus, .share-form textarea:focus, .share-form select:focus {
    border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(255,90,78,0.08);
  }
  .share-form textarea { resize: vertical; min-height: 84px; }
  .share-list h2 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .share-item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px; margin-bottom: 16px;
    transition: all .2s; box-shadow: 0 4px 14px rgba(35,35,38,0.04);
  }
  .share-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .share-item .si-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .share-item .si-name { font-weight: 800; font-size: 15px; }
  .share-item .si-tag {
    font-size: 12px; color: var(--accent); font-weight: 700;
    background: rgba(255,90,78,0.08); padding: 3px 10px; border-radius: 999px;
  }
  .share-item p { font-size: 14px; color: var(--muted); }

  .empty-list { color: var(--muted); text-align: center; padding: 50px 0; font-size: 15px; }

  @media (max-width: 760px) {
    .creators { grid-template-columns: 1fr; }
    .share-grid { grid-template-columns: 1fr; }
    .num-row { flex-direction: column; }
    #styleGroup .choice { width: 84px; height: 84px; }
    .hex-row.shift { margin-left: 42px; }
    .form-card { padding: 28px 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo" onclick="goPage(0)"><span class="logo-icon">✦</span>穿搭<span>指南</span></div>
    <div class="steps">
      <div class="step active" id="step1"><span class="step-num">1</span><span class="step-label">填写信息</span></div>
      <span class="step-divider">—</span>
      <div class="step" id="step2"><span class="step-num">2</span><span class="step-label">博主推荐</span></div>
      <span class="step-divider">—</span>
      <div class="step" id="step3"><span class="step-num">3</span><span class="step-label">分享穿搭</span></div>
    </div>
  </div>
</header>

<main>
  <!-- 第 1 页：信息填写 -->
  <section class="page active" id="page0">
    <div class="form-card">
      <h1>先了解你，再给你推荐</h1>
      <p>花 30 秒填一下，我们按你的情况匹配适合的穿搭博主。</p>

      <div class="field">
        <label>你的性别</label>
        <div class="choice-group" id="genderGroup">
          <div class="choice" data-val="male">👦 男生</div>
          <div class="choice" data-val="female">👧 女生</div>
        </div>
      </div>

      <div class="field">
        <label>身高 & 体重</label>
        <div class="num-row">
          <div class="num-field">
            <input type="number" id="height" placeholder="身高 (cm)" min="120" max="230">
            <small>例：170</small>
          </div>
          <div class="num-field">
            <input type="number" id="weight" placeholder="体重 (kg)" min="30" max="200">
            <small>例：60</small>
          </div>
        </div>
      </div>

      <div class="field">
        <label>喜欢的风格（可多选）</label>
        <div class="choice-group" id="styleGroup">
          <div class="hex-row">
            <div class="choice" data-val="casual"><span class="choice-emoji">👕</span>休闲<small class="ch-desc">日常舒适</small></div>
            <div class="choice" data-val="commute"><span class="choice-emoji">💼</span>通勤<small class="ch-desc">上班上学</small></div>
            <div class="choice" data-val="campus"><span class="choice-emoji">🎓</span>学院风<small class="ch-desc">青春校园</small></div>
            <div class="choice" data-val="minimal"><span class="choice-emoji">🤍</span>简约风<small class="ch-desc">干净利落</small></div>
          </div>
          <div class="hex-row shift">
            <div class="choice" data-val="vintage"><span class="choice-emoji">🕰️</span>复古风<small class="ch-desc">怀旧质感</small></div>
            <div class="choice" data-val="formal"><span class="choice-emoji">🤵</span>职场风<small class="ch-desc">专业正式</small></div>
            <div class="choice" data-val="date"><span class="choice-emoji">🌹</span>约会风<small class="ch-desc">精致有型</small></div>
            <div class="choice" data-val="street"><span class="choice-emoji">🛹</span>街头<small class="ch-desc">嘻哈潮流</small></div>
          </div>
          <div class="hex-row">
            <div class="choice" data-val="party"><span class="choice-emoji">🎉</span>聚会<small class="ch-desc">热闹出彩</small></div>
            <div class="choice" data-val="travel"><span class="choice-emoji">✈️</span>旅行度假<small class="ch-desc">轻松出行</small></div>
            <div class="choice" data-val="gala"><span class="choice-emoji">👑</span>正式宴会<small class="ch-desc">隆重场合</small></div>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextPage()">查看推荐 →</button>
      </div>
    </div>
  </section>

  <!-- 第 2 页：博主推荐 -->
  <section class="page" id="page1">
    <div class="result-head">
      <h1>为你找到这些博主</h1>
      <p id="resultSummary">根据你的信息，推荐以下参考风格</p>
      <div class="result-tags" id="resultTags"></div>
    </div>
    <div class="creators" id="creatorList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:40px;">
      <button class="btn btn-ghost" onclick="goPage(0)">← 重新填写</button>
      <button class="btn btn-primary" onclick="goPage(2)">分享我的穿搭 →</button>
    </div>
  </section>

  <!-- 第 3 页：分享 -->
  <section class="page" id="page2">
    <div class="share-grid">
      <div class="share-form">
        <h2>分享你的穿搭</h2>
        <input type="text" id="shareName" placeholder="你的昵称">
        <select id="shareStyle">
          <option value="">选择风格</option>
          <option value="休闲">休闲</option>
          <option value="通勤">通勤</option>
          <option value="潮流">潮流</option>
          <option value="运动">运动</option>
        </select>
        <textarea id="shareText" placeholder="介绍你的搭配，比如：宽松白T + 直筒牛仔裤 + 帆布鞋"></textarea>
        <button class="btn btn-primary" style="width:100%;" onclick="submitShare()">发布分享</button>
      </div>
      <div class="share-list">
        <h2>大家的穿搭</h2>
        <div id="shareList"></div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center; margin-top:40px;">
      <button class="btn btn-ghost" onclick="goPage(1)">← 返回推荐</button>
    </div>
  </section>
</main>

<script>
  const CREATORS = [
    { name: "八号机", gender: "unisex", height: 160, styles: ["street"], desc: "男女通用街头穿搭，中性风酷感十足", avatar: "#ff6b5a", douyinId: "buzzlightyear8zz", link: "https://www.douyin.com/search/buzzlightyear8zz?type=user", tags: ["通用","街头"] },
    { name: "707", gender: "female", height: 160, styles: ["street"], desc: "街头风女生穿搭，酷感又日常", avatar: "#7c6bd6", douyinId: "DqNanA_707", link: "https://www.douyin.com/search/DqNanA_707?type=user", tags: ["街头","女生"] },
    { name: "郑不凡", gender: "male", height: 160, styles: ["casual"], desc: "小个子男生休闲穿搭，舒适又有型", avatar: "#4fae8c", douyinId: "Zf19970721", link: "https://www.douyin.com/search/Zf19970721?type=user", tags: ["休闲","男生"] },
    { name: "痴五安", gender: "male", height: 160, styles: ["casual"], desc: "日常休闲男装穿搭，简约不单调", avatar: "#e0a458", douyinId: "chammy666", link: "https://v.douyin.com/xiJF8DFOjOw/", tags: ["日常","休闲"] },
    { name: "活波人生", gender: "male", height: 170, styles: ["casual","street"], desc: "日常街头混搭男装，随性有个性", avatar: "#5b8fd6", douyinId: "faximsstore", link: "https://www.douyin.com/search/faximsstore?type=user", tags: ["日常","街头"] },
    { name: "郭广大", gender: "male", height: 180, styles: ["street"], desc: "高个子潮流穿搭，气场十足", avatar: "#d66ba8", douyinId: "6576957", link: "https://www.douyin.com/search/6576957?type=user", tags: ["潮流","高个"] },
    { name: "鱼仔不喝汤", gender: "male", height: 185, styles: ["street"], desc: "街头潮流男装，型格十足", avatar: "#6b8ad6", douyinId: "76244170467", link: "https://www.douyin.com/search/76244170467?type=user", tags: ["街头","潮流"] },
  ];

  const STYLE_NAMES = { casual: "休闲", commute: "通勤", campus: "学院风", minimal: "简约风", vintage: "复古风", formal: "职场风", date: "约会风", street: "街头", party: "聚会", travel: "旅行度假", gala: "正式宴会" };
  const GENDER_NAMES = { male: "男生", female: "女生" };

  let userInfo = { gender: "", height: 0, weight: 0, styles: [] };
  let shares = JSON.parse(localStorage.getItem("shares") || "[]");

  function initChoices() {
    document.querySelectorAll(".choice-group").forEach(group => {
      group.addEventListener("click", e => {
        const c = e.target.closest(".choice");
        if (!c) return;
        const multi = c.closest("#styleGroup");
        if (multi) {
          c.classList.toggle("selected");
        } else {
          c.parentElement.querySelectorAll(".choice").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
        }
      });
    });
  }

  function nextPage() {
    const gender = document.querySelector("#genderGroup .choice.selected");
    const height = parseFloat(document.getElementById("height").value);
    const weight = parseFloat(document.getElementById("weight").value);
    const styles = [...document.querySelectorAll("#styleGroup .choice.selected")].map(c => c.dataset.val);

    if (!gender) { alert("请选择性别"); return; }
    if (!height || !weight) { alert("请填写身高和体重"); return; }
    if (styles.length === 0) { alert("请至少选择一个风格"); return; }

    userInfo = { gender: gender.dataset.val, height, weight, styles };
    renderResult();
    goPage(1);
  }

  function renderResult() {
    const matched = CREATORS.filter(c =>
      (c.gender === userInfo.gender || c.gender === "unisex") &&
      c.styles.some(s => userInfo.styles.includes(s))
    ).sort((a, b) => heightScore(a) - heightScore(b));
    const fallback = matched.length === 0
      ? CREATORS.filter(c => c.gender === userInfo.gender || c.gender === "unisex").sort((a, b) => heightScore(a) - heightScore(b))
      : matched;

    document.getElementById("resultSummary").textContent =
      `${GENDER_NAMES[userInfo.gender]} · 身高${userInfo.height}cm · 体重${userInfo.weight}kg`;

    const tags = document.getElementById("resultTags");
    tags.innerHTML = userInfo.styles.map(s => `<span class="result-tag">${STYLE_NAMES[s]}</span>`).join("");

    const list = document.getElementById("creatorList");
    list.innerHTML = fallback.map((c, i) => `
      <div class="creator">
        <div class="creator-avatar" style="background:linear-gradient(135deg, ${c.avatar}, ${shade(c.avatar)})">${c.name[0]}</div>
        <h3>${c.name}</h3>
        <p class="creator-desc">${c.desc}</p>
        <div class="creator-meta">${c.tags.map(t => `<span>${t}</span>`).join("")}<span class="height-tag">身高 ${c.height}cm</span></div>
        <a class="creator-link" href="${c.link}" target="_blank" rel="noopener">抖音：${c.douyinId || "去搜索"} →</a>
      </div>
    `).join("");
  }

  function shade(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (n >> 16) + 60), g = Math.min(255, ((n >> 8) & 0xff) + 40), b = Math.min(255, (n & 0xff) + 60);
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, "0")}`;
  }

  function heightScore(c) {
    return Math.abs(c.height - userInfo.height);
  }

  function goPage(n) {
    document.querySelectorAll(".page").forEach((p, i) => p.classList.toggle("active", i === n));
    document.querySelectorAll(".step").forEach((s, i) => {
      s.classList.toggle("active", i === n);
      s.classList.toggle("done", i < n);
    });
    window.scrollTo({ top: 0 });
  }

  function submitShare() {
    const name = document.getElementById("shareName").value.trim();
    const style = document.getElementById("shareStyle").value;
    const text = document.getElementById("shareText").value.trim();
    if (!name || !style || !text) { alert("请填写完整再发布"); return; }

    shares.unshift({ name, style, text, time: new Date().toLocaleDateString() });
    localStorage.setItem("shares", JSON.stringify(shares));
    document.getElementById("shareName").value = "";
    document.getElementById("shareStyle").value = "";
    document.getElementById("shareText").value = "";
    renderShares();
  }

  function renderShares() {
    const list = document.getElementById("shareList");
    if (shares.length === 0) {
      list.innerHTML = `<div class="empty-list">还没有分享，来发第一条吧 🎉</div>`;
      return;
    }
    list.innerHTML = shares.map(s => `
      <div class="share-item">
        <div class="si-head">
          <span class="si-name">${s.name}</span>
          <span class="si-tag">${s.style}</span>
        </div>
        <p>${s.text}</p>
        <small style="color:var(--muted)">${s.time}</small>
      </div>
    `).join("");
  }

  initChoices();
  renderShares();
</script>

</body>
</html>
